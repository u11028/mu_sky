# Render blueprint: https://render.com/docs/blueprint-spec
# Builds the game and runs one Node server for the page and the multiplayer rooms.
#
# This is the free plan: no card needed, but the server sleeps after a while without players
# and its files start over each time. Set MONGODB_URI (a free MongoDB Atlas database) and levels,
# gold, gear, accounts and GM rights are kept there instead; without it they are lost then.
services:
  - type: web
    name: mu-sky
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Render's proxy forwards each player's real address; bans by address need it.
      - key: TRUST_PROXY
        value: "1"
      # Asked for when the blueprint is created: the secret typed in the game as "/gm <key>".
      - key: GM_KEY
        sync: false
      # Also asked for: the MongoDB Atlas connection string (mongodb+srv://...). Keeps the players' data.
      - key: MONGODB_URI
        sync: false
